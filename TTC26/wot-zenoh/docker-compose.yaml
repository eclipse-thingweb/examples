services:
  zenoh-router:
    image: eclipse/zenoh:latest
    container_name: zenoh-router
    ports:
      - "7447:7447"
      - "7446:7446/udp"
    volumes:
      - ./zenoh-router-config.json5:/config.json5:ro
    command: ["-c", "/config.json5"]
    restart: unless-stopped
  zenoh-mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenoh-ttc-mqtt-bridge:latest
    container_name: zenoh-mqtt-bridge
    ports:
      - "8883:8883"
    volumes:
      - ./zenoh-bridge-config.json5:/config.json5:ro
    command: ["-c", "/config.json5"]
    restart: unless-stopped